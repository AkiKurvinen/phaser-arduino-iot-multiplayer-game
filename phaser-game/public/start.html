<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Game</title>
</head>

<body>
    <h1>Enter Game Details</h1>
    <form id="startForm" action="index.html" method="get">
        <label for="username">Username:</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
        <br><br>

        <label for="color">Choose your ship color:</label>
        <input type="color" id="color" name="color" value="#ff0000">
        <br><br>

        <label for="lobby">Lobby:</label>
        <input type="text" id="lobby" name="lobby" placeholder="Enter lobby name">
        <br><br>

        <label for="spectator">Watch as spectator:</label>
        <input type="checkbox" id="spectator" name="spectator" value="true">
        <br><br>

        <button type="submit">Start Game</button>
    </form>
    <script>
        const spectator = document.getElementById('spectator');
        const username = document.getElementById('username');
        const color = document.getElementById('color');
        function updatePlayerFields() {
            username.disabled = spectator.checked;
            username.required = !spectator.checked;
            color.disabled = spectator.checked;
        }
        spectator.addEventListener('change', updatePlayerFields);
        updatePlayerFields();
    </script>
</body>

</html>
